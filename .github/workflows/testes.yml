name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regras de negócio, contraste e auditoria estática
        run: npm test
      - name: Fluxos de tela (DOM simulado)
        run: npm run test:dom
      - name: Formatação
        run: npm run verificar-formatacao
